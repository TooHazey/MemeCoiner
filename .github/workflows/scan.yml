name: scan
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scanner.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - run: |
          git config user.name "memewatch-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
